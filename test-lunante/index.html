<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test lunante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Literata:ital,opsz,wght@0,7..72,300..600;1,7..72,300..500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una sola columna de cuaderno; la luna crece con el avance y preside la cabecera */
:root{
  --paper:#EDEFF4; --card:#F8F9FB; --ink:#1A2042; --muted:#596084; --line:#CBD0DE;
  --accent:#34449E; --accent-ink:#FFFFFF; --moon:#D9A62E; --moon-shadow:#D5D9E6; --soft:#E1E5F0; --logo-chip:transparent; --logo-pad:0;
  --f-display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body:"Literata", "Iowan Old Style", Georgia, serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1225; --card:#161B34; --ink:#E6E8F2; --muted:#9CA3C3; --line:#2B3256;
  --accent:#9AA7FF; --accent-ink:#0E1225; --moon:#F0CC6A; --moon-shadow:#232A4A; --soft:#1C2242; --logo-chip:#EDEFF4; --logo-pad:6px 12px; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1225; --card:#161B34; --ink:#E6E8F2; --muted:#9CA3C3; --line:#2B3256;
  --accent:#9AA7FF; --accent-ink:#0E1225; --moon:#F0CC6A; --moon-shadow:#232A4A; --soft:#1C2242; --logo-chip:#EDEFF4; --logo-pad:6px 12px; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;padding-inline:18px;padding-block:0 64px}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:22px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{display:block;height:41px;width:auto;max-width:100%}
.brand{background:var(--logo-chip);border-radius:6px;padding:var(--logo-pad)}

/* Intro */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding-block:44px 28px}
.hero h1{font-family:var(--f-display);font-weight:500;font-size:clamp(40px,8vw,68px);line-height:1.02;margin:10px 0 18px;text-wrap:balance;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero p{margin:0;max-width:52ch;color:var(--muted)}
.hero .bigmoon{width:min(30vw,170px)}
.ejes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0;border-top:1px solid var(--line);margin-block:10px 30px}
.ejes div{padding:12px 4px;border-bottom:1px solid var(--line);font-size:15px}
.ejes b{font-weight:500;display:block;font-family:var(--f-display);font-size:19px}
.ejes small{color:var(--muted);font-size:14px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:13px 26px;font-family:var(--f-mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.note{font-size:14px;color:var(--muted);font-style:italic;max-width:60ch;margin-top:26px}

/* Quiz */
.qhead{display:flex;align-items:center;gap:16px;padding-block:26px 8px}
.qhead svg{width:54px;height:54px;flex:none}
.qhead .meta{min-width:0}
.qhead .count{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qprompt{font-family:var(--f-display);font-weight:500;font-size:clamp(25px,4.6vw,34px);line-height:1.15;margin:14px 0 22px;text-wrap:balance}
.stmt{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;font-size:17px}
.stmt.frag{font-style:italic;font-size:17.5px;line-height:1.65;white-space:pre-line}
.stmt .tag{display:block;margin-bottom:4px}
.scale{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,26px);padding-block:18px}
.dot{border:2px solid var(--accent);background:transparent;border-radius:50%;padding:0;transition:background .15s, transform .15s}
.dot:hover{transform:scale(1.08)}
.dot[aria-pressed="true"]{background:var(--accent)}
.dot.s2{width:46px;height:46px}.dot.s1{width:36px;height:36px}.dot.s0{width:26px;height:26px;border-color:var(--muted)}
.dot.s0[aria-pressed="true"]{background:var(--muted)}
.scale-legend{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:-8px;margin-bottom:12px}
.hint{margin:-10px 0 16px;color:var(--muted);font-size:15px}
.opts{display:grid;grid-template-columns:1fr;gap:12px}
.opt{display:flex;flex-direction:column;justify-content:space-between;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;font-size:17px;line-height:1.55;min-width:0;transition:border-color .15s, box-shadow .15s}
.opt.frag .opttext{font-style:italic;white-space:pre-line}
.opt:hover{border-color:var(--accent)}
.opt .optcta{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.extra{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px}
.pill{background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:15px;color:var(--muted)}
.pill:hover{border-color:var(--accent);color:var(--ink)}
.pill[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.choices{display:grid;gap:10px}
.choice{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 18px;font-size:17px}
.choice:hover{border-color:var(--accent)}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:12px}
.linkbtn{background:none;border:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 0}
.linkbtn:hover{color:var(--ink)}
.linkbtn:disabled{opacity:.35;cursor:default}

/* Resultados */
.rhero{padding-block:40px 18px;border-bottom:1px solid var(--line)}
.rhero h1{font-family:var(--f-display);font-weight:500;font-size:clamp(34px,6.5vw,54px);line-height:1.05;margin:10px 0 8px;text-wrap:balance}
.rhero h1 .sep{color:var(--moon);font-style:normal;padding-inline:.15em}
.rhero h1 i{font-weight:400}
.rhero p{color:var(--muted);margin:10px 0 0;max-width:60ch}
section.r{padding-block:30px 6px}
section.r > h2{font-family:var(--f-display);font-weight:500;font-size:28px;margin:6px 0 16px;text-wrap:balance}
.axis{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding-block:14px;border-bottom:1px solid var(--line)}
.axis .row{display:grid;grid-template-columns:7.5em minmax(0,1fr) 7.5em;align-items:center;gap:12px}
.axis .pole{font-family:var(--f-display);font-size:17px;line-height:1.15}
.axis .pole.b{text-align:right}
.axis .pole.on{color:var(--accent);font-weight:600}
.track{position:relative;height:2px;background:var(--line)}
.track::before{content:"";position:absolute;left:50%;top:-5px;width:1px;height:12px;background:var(--line)}
.track .mk{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--moon);transform:translate(-50%,-50%);box-shadow:0 0 0 4px var(--paper)}
.axis .desc{font-size:15px;color:var(--muted);margin:2px 0 0}
.axis .desc b{color:var(--ink);font-weight:500}
.portraits{display:grid;gap:18px}
.portrait{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 22px}
.portrait h3{font-family:var(--f-display);font-weight:500;font-size:26px;margin:4px 0 10px;line-height:1.1}
.portrait p{margin:0 0 10px}
.portrait .kv{font-size:15px;color:var(--muted)}
.portrait .kv b{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);font-weight:500;margin-right:6px}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.excard{border-top:2px solid var(--moon);padding-top:10px}
.excard.wide{grid-column:1/-1}
.excard h4{font-family:var(--f-display);font-size:20px;font-weight:500;margin:4px 0 6px}
.excard p{margin:0;font-size:15.5px}
.quote{font-family:var(--f-display);font-style:italic;font-size:21px;line-height:1.35;margin:4px 0 14px;padding-left:16px;border-left:2px solid var(--moon)}
.quote small{display:block;font-family:var(--f-mono);font-style:normal;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px;align-items:center}
.toast{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
textarea.copy{width:100%;min-height:160px;margin-top:12px;font-family:var(--f-mono);font-size:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px}
footer{margin-top:44px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}

@media (max-width:560px){
  .hero{grid-template-columns:1fr}
  .hero .bigmoon{order:-1;width:96px}
  .axis .row{grid-template-columns:5.6em minmax(0,1fr) 5.6em;gap:8px}
  .axis .pole{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ===================== Estado ===================== */
const KEY = "test-lunante-v3";
let st = {screen:"intro", i:0, ans:{}};
try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s && s.ans) st = s; }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function moon(p, size){
  const r=40, rx=Math.abs(1-2*p)*r, sweep = p<0.5?0:1;
  const lit = p<=0.001 ? "" : p>=0.999
    ? `<circle cx="50" cy="50" r="40" fill="var(--moon)"/>`
    : `<path d="M50,10 A40,40 0 0,1 50,90 A${rx.toFixed(2)},40 0 0,${sweep} 50,10Z" fill="var(--moon)"/>`;
  return `<svg viewBox="0 0 100 100" ${size?`class="${size}"`:""} aria-hidden="true"><circle cx="50" cy="50" r="40" fill="var(--moon-shadow)"/>${lit}</svg>`;
}

/* ===================== Pantallas ===================== */
function render(){
  if(st.screen==="intro") return intro();
  if(st.screen==="quiz") return quiz();
  return results();
}

function intro(){
  const started = Object.keys(st.ans).length>0;
  app.innerHTML = `
  <section class="hero">
    <div>
      <span class="mono">Un juego de autoconocimiento para el taller</span>
      <h1>¿Qué clase de escritor o escritora <em>sos?</em></h1>
      <p>Veintiséis preguntas, unos siete minutos. Ninguna respuesta es mejor que otra: como dice el manual, las formas de trabajar son simplemente diferentes, y lo importante es reconocer cuál se ajusta a tu modo de pensar para trabajar a partir de esa convicción.</p>
    </div>
    ${moon(0.22,"bigmoon")}
  </section>
  <div class="cta-row">
    <button class="btn" id="go">${started?"Seguir donde quedé":"Empezar"}</button>
    ${started?`<button class="btn ghost" id="reset">Empezar de nuevo</button>`:""}
  </div>
  <p class="note">En cada pregunta vas a ver dos opciones: tocá la que más se parezca a vos. Si te representan las dos, o ninguna, también podés decirlo. Respondé pensando en cómo escribís hoy y no en cómo te gustaría escribir.</p>`;
  document.getElementById("go").onclick = ()=>{ st.screen="quiz"; if(!started) st.i=0; save(); render(); window.scrollTo(0,0); };
  const r=document.getElementById("reset"); if(r) r.onclick=()=>{ st={screen:"quiz",i:0,ans:{}}; save(); render(); };
}

function quiz(){
  const q = Q[st.i], n = Q.length, cur = st.ans[st.i];
  const p = st.i/n;
  let body;
  if(q.cat){
    body = `<div class="choices">${q.opts.map(([k,t])=>`<button class="choice" data-k="${k}" aria-pressed="${cur===k}">${esc(t)}</button>`).join("")}</div>
      <div class="extra"><button class="pill" data-k="ninguna" aria-pressed="${cur==="ninguna"}">Ninguna de estas</button></div>`;
  } else {
    const flip = st.i%2===1; // alterna qué opción aparece primero
    const first = flip?["B",q.b]:["A",q.a], second = flip?["A",q.a]:["B",q.b];
    const card = ([k,t])=>`<button class="opt ${q.frag?"frag":""}" data-v="${k}" aria-pressed="${cur===k}"><span class="opttext">${esc(t)}</span><span class="optcta">${cur===k?"✓ Elegida":"Elijo esta"}</span></button>`;
    body = `<div class="opts">${card(first)}${card(second)}</div>
      <div class="extra">
        <button class="pill" data-v="AMBAS" aria-pressed="${cur==="AMBAS"}">Las dos por igual</button>
        <button class="pill" data-v="NINGUNA" aria-pressed="${cur==="NINGUNA"}">Ninguna de las dos</button>
      </div>`;
  }
  app.innerHTML = `
    <div class="qhead">${moon(Math.max(p,0.03))}
      <div class="meta"><span class="mono">Pregunta</span><div class="count">${st.i+1} / ${n}</div></div>
    </div>
    <h2 class="qprompt">${esc(q.p)}</h2>
    <p class="hint">${q.cat?"Tocá la opción que más se parezca a tu experiencia.":"Tocá la opción que más se parezca a vos."}</p>
    ${body}
    <div class="qnav">
      <button class="linkbtn" id="prev" ${st.i===0?"disabled":""}>← Anterior</button>
      <button class="linkbtn" id="exit">Volver al inicio</button>
      <button class="linkbtn" id="next" ${cur===undefined?"disabled":""}>Siguiente →</button>
    </div>`;
  const advance = ()=>{ if(st.i<n-1){ st.i++; } else { st.screen="results"; } save(); render(); window.scrollTo({top:0}); };
  app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
    st.ans[st.i]=b.dataset.v; save();
    app.querySelectorAll("[data-v]").forEach(d=>d.setAttribute("aria-pressed", d===b));
    setTimeout(advance,280);
  });
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
    st.ans[st.i]=b.dataset.k; save();
    app.querySelectorAll("[data-k]").forEach(d=>d.setAttribute("aria-pressed", d===b));
    setTimeout(advance,280);
  });
  document.getElementById("prev").onclick=()=>{ if(st.i>0){st.i--; save(); render();} };
  document.getElementById("next").onclick=()=>{ if(st.ans[st.i]!==undefined) advance(); };
  document.getElementById("exit").onclick=()=>{ st.screen="intro"; save(); render(); };
}

/* ===================== Cálculo ===================== */
function scores(){
  const sum={}, cnt={};
  Q.forEach((q,i)=>{ if(q.cat) return; const v=st.ans[i];
    const val = v==="A"?-1 : v==="B"?1 : v==="AMBAS"?0 : null;
    if(val===null) return;
    sum[q.ax]=(sum[q.ax]||0)+val; cnt[q.ax]=(cnt[q.ax]||0)+1; });
  const s={}; Object.keys(AXES).forEach(a=>{ s[a]= cnt[a]? sum[a]/cnt[a] : 0; }); // -1 polo A … +1 polo B
  s._none = Object.keys(AXES).filter(a=>!cnt[a]);
  return s;
}
const side = v => v<0?"A":"B";
const level = v => { const m=Math.abs(v); return m<0.25?"mixto":m<0.75?"inclinado":"marcado"; };
function poleText(ax,v,none){
  const A=AXES[ax], L=level(v);
  if(none) return `<b>Sin respuesta.</b> Ninguna de las opciones te representó; este eje queda abierto.`;
  if(L==="mixto") return `<b>Zona mixta.</b> ${A.dm}`;
  const pole = v<0?A.a:A.b, d = v<0?A.da:A.db;
  return `<b>${L==="marcado"?"Marcadamente":"Con inclinación hacia"} ${pole.toLowerCase()}.</b> ${d}`;
}
function stronger(a,b,s){ return Math.abs(s[a])>=Math.abs(s[b])?a:b; }

function results(){
  const s = scores();
  const m = METODO[side(s.proceso)+side(s.mente)];
  const f = FORMA[side(s.pulso)+side(s.densidad)];
  const t = TERR[side(s.mundo)+side(s.materia)];

  const ritmo = level(s.ritmo)==="mixto"?"alternando disciplina y ráfagas":(s.ritmo<0?"con disciplina de reloj":"a ráfagas");
  const aliento = level(s.aliento)==="mixto"?"con soltura tanto en lo breve como en lo extenso":(s.aliento<0?"con aliento de fondo":"con preferencia por la distancia corta");
  const lector = level(s.lector)==="mixto"?"un punto intermedio entre la minoría cómplice y el gran público":(s.lector<0?"una lectura de culto, que relee y completa":"un público amplio, que quiere saber qué pasa");

  const pc={}; Q.forEach((q,i)=>{ if(q.cat && st.ans[i] && st.ans[i]!=="ninguna") pc[st.ans[i]]=(pc[st.ans[i]]||0)+1; });
  const maxp = Math.max(0,...Object.values(pc));
  const piedras = Object.keys(pc).filter(k=>pc[k]===maxp);

  const exAxes = [stronger("proceso","mente",s), stronger("pulso","densidad",s), stronger("mundo","materia",s)];
  const exItems = [];
  exAxes.forEach(ax=>{
    const own = s[ax]<0?"a":"b", other = own==="a"?"b":"a";
    exItems.push({k:"Para afianzar", e:EJ[ax][own], ax}, {k:"Para contrapesar", e:EJ[ax][other], ax});
  });


  const axesHtml = Object.keys(AXES).map(ax=>{
    const v=s[ax], A=AXES[ax], pos=((v+1)/2*100).toFixed(1), L=level(v);
    return `<div class="axis">
      <span class="mono">${A.name}</span>
      <div class="row">
        <span class="pole a ${L!=="mixto"&&v<0?"on":""}">${A.a}</span>
        <div class="track" role="img" aria-label="${A.a} ${Math.round((1-v)/2*100)}%, ${A.b} ${Math.round((1+v)/2*100)}%"><span class="mk" style="left:${pos}%"></span></div>
        <span class="pole b ${L!=="mixto"&&v>0?"on":""}">${A.b}</span>
      </div>
      <p class="desc">${poleText(ax,v,s._none.includes(ax))}</p>
    </div>`;
  }).join("");

  const portrait = (lab,o)=>`<article class="portrait">
      <span class="mono">${lab}</span><h3>${o.n}</h3><p>${o.d}</p>
      <p class="kv" style="margin:0"><b>Riesgo</b>${o.r}</p></article>`;

  const piedraHtml = piedras.length? piedras.map(k=>{ const p=PIEDRAS[k]; return `
      <h3 style="font-family:var(--f-display);font-weight:500;font-size:24px;margin:8px 0 10px">${p.n}</h3>
      <div class="quote">«${p.q}»<small>${p.qa}</small></div>
      <p style="margin:0 0 18px">${p.t}</p>`;}).join("") : `<p>Ninguna de las dificultades típicas que describe el manual te frena especialmente. Buena noticia.</p>`;

  app.innerHTML = `
    <section class="rhero">
      <span class="mono">Tu constelación</span>
      <h1>${m.n}<span class="sep">·</span><i>${f.n}</i><span class="sep">·</span>${t.n}</h1>
      <p>Escribís ${ritmo}, ${aliento}, pensando en ${lector}.</p>
    </section>

    <section class="r">
      <span class="mono">Tres retratos</span>
      <h2>Cómo trabajás, qué forma buscás, de qué materia escribís</h2>
      <div class="portraits">
        ${portrait("Método · proceso y mente",m)}
        ${portrait("Forma · pulso y densidad",f)}
        ${portrait("Territorio · mundo y materia",t)}
      </div>
    </section>

    <section class="r">
      <span class="mono">Los nueve ejes</span>
      <h2>Dónde caés en cada espectro</h2>
      ${axesHtml}
    </section>

    <section class="r">
      <span class="mono">Piedras del camino</span>
      <h2>Lo que más te frena</h2>
      ${piedraHtml}
    </section>

    <section class="r">
      <h2>Ejercicios para tu perfil</h2>
      <p style="margin:-6px 0 18px;color:var(--muted);font-size:15.5px">${piedras.length?"Uno para lo que más te frena y, en cada retrato, uno para afianzar tu inclinación y otro para probar el polo contrario, en el eje donde tu perfil salió más marcado.":"En cada retrato, uno para afianzar tu inclinación y otro para probar el polo contrario, en el eje donde tu perfil salió más marcado."}</p>
      <div class="ex">${piedras.map(k=>{const p=PIEDRAS[k];return `<div class="excard wide"><span class="mono">Para ${p.n.toLowerCase()}</span><h4>${p.e[0]}</h4><p>${p.e[2]}</p></div>`}).join("")}${exItems.map(x=>`<div class="excard"><span class="mono">${x.k} · ${AXES[x.ax].name}</span><h4>${x.e[0]}</h4><p>${x.e[2]}</p></div>`).join("")}</div>
    </section>


    <div class="tools">
      <button class="btn" id="copy">Copiar resultado</button>
      <button class="btn ghost" id="again">Hacer el test de nuevo</button>
      <span class="toast" id="toast" aria-live="polite"></span>
    </div>
    <textarea class="copy" id="copytxt" hidden readonly aria-label="Resultado en texto"></textarea>`;

  const txt = [
    `TEST LUNANTE — ${m.n} · ${f.n} · ${t.n}`,
    `Escribís ${ritmo}, ${aliento}, pensando en ${lector}.`, "",
    ...Object.keys(AXES).map(ax=>{const v=s[ax],A=AXES[ax];return `${A.name}: ${A.a} ${Math.round((1-v)/2*100)}% / ${A.b} ${Math.round((1+v)/2*100)}%`}),
    "", `Piedra del camino: ${piedras.map(k=>PIEDRAS[k].n).join(", ")||"—"}`,
    `Ejercicios: ${[...piedras.map(k=>PIEDRAS[k].e),...exItems.map(x=>x.e)].map(e=>e[0]).filter((v,i,a)=>a.indexOf(v)===i).join(", ")}`
  ].join("\n");
  document.getElementById("copy").onclick = ()=>{
    const toast=document.getElementById("toast"), ta=document.getElementById("copytxt");
    const fallback=()=>{ ta.value=txt; ta.hidden=false; ta.select(); toast.textContent="Seleccioná el texto y copialo."; };
    try{ navigator.clipboard.writeText(txt).then(()=>toast.textContent="Copiado.").catch(fallback); }catch(e){ fallback(); }
  };
  document.getElementById("again").onclick=()=>{ st={screen:"intro",i:0,ans:{}}; save(); render(); window.scrollTo(0,0); };
}

render();
</script>
</body>
</html>
